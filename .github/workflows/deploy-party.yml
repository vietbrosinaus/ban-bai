name: Deploy party server

on:
  push:
    branches: [main]
    paths:
      - "party/**"
      - "lib/**"
      - "partykit.json"
      - "package-lock.json"
      - ".github/workflows/deploy-party.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-party
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to PartyKit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check the deploy credentials exist
        run: |
          if [ -z "$PARTYKIT_LOGIN" ] || [ -z "$PARTYKIT_TOKEN" ]; then
            echo "::error::PARTYKIT_LOGIN and PARTYKIT_TOKEN are not set. The repository owner creates them with 'npx partykit token generate' and adds them under Settings, Secrets and variables, Actions."
            exit 1
          fi
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}

      - name: Deploy
        run: npx partykit deploy
        timeout-minutes: 5
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
