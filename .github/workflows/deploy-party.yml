name: Deploy party server

on:
  push:
    branches: [main]
    paths:
      - "party/**"
      - "lib/**"
      - "partykit.json"
      - "package-lock.json"
      - ".github/workflows/deploy-party.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-party
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to PartyKit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Look for deploy credentials
        id: creds
        run: |
          if [ -n "$PARTYKIT_LOGIN" ] && [ -n "$PARTYKIT_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Party server not deployed. PARTYKIT_LOGIN and PARTYKIT_TOKEN are not set, so this step was skipped. The repository owner creates them with 'npx partykit token generate' and adds them under Settings, Secrets and variables, Actions."
          fi
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx partykit deploy
        timeout-minutes: 5
        env:
          PARTYKIT_LOGIN: ${{ secrets.PARTYKIT_LOGIN }}
          PARTYKIT_TOKEN: ${{ secrets.PARTYKIT_TOKEN }}
