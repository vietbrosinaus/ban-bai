name: Deploy party server

on:
  push:
    branches: [main]
    paths:
      - "party/**"
      - "lib/**"
      - "wrangler.jsonc"
      - "package-lock.json"
      - ".github/workflows/deploy-party.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-party
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to Cloudflare
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Look for deploy credentials
        id: creds
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Party server not deployed. CLOUDFLARE_API_TOKEN is not set, so this step was skipped. The repository owner creates a token at dash.cloudflare.com with the 'Edit Cloudflare Workers' template and adds it under Settings, Secrets and variables, Actions."
          fi
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      - name: Deploy
        if: steps.creds.outputs.ready == 'true'
        run: npx wrangler deploy
        timeout-minutes: 5
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
